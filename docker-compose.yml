services:
  postgres:
    image: postgres:17-alpine
    container_name: sesaji-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sesaji
    ports:
      - "5432:5432"
    volumes:
      - sesaji_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sesaji"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  sesaji_pgdata:
